name: hmc
description: Hasan Mobile Center - Shewa Adda. Offline-first mobile shop management (inventory, sales, accounting, reports).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, navigation, database
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  drift: ^2.28.2
  drift_flutter: ^0.2.5
  sqlite3_flutter_libs: ^0.5.42
  # NOTE: firebase_core removed 2026-10-21 — its Windows C++ SDK uses
  # cmake_minimum_required < 3.5 which the CI CMake rejects. Will re-add
  # with proper platform handling when cloud sync is implemented.

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.6
  path: ^1.9.1

  # Files, sharing, printing
  path_provider: ^2.1.5
  file_picker: ^10.3.7
  share_plus: ^11.1.0
  url_launcher: ^6.3.2
  pdf: ^3.11.3
  printing: ^5.14.2
  csv: ^6.0.0

  # Device
  image_picker: ^1.2.0
  mobile_scanner: ^7.1.2

  # Charts
  fl_chart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
