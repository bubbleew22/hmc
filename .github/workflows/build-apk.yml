name: Build HMC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Set up release signing
        run: |
          echo "${{ secrets.HMC_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/hmc-release.jks"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storePassword=${{ secrets.HMC_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.HMC_KEY_PASSWORD }}
          keyAlias=${{ secrets.HMC_KEY_ALIAS }}
          storeFile=$GITHUB_WORKSPACE/android/hmc-release.jks
          EOF

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: HMC-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: HMC-windows-exe
          path: build/windows/x64/runner/Release

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Unsigned: no Apple Developer signing available, so this IPA cannot
      # be installed on a real iPhone. It is built for archiving only.
      - run: flutter build ios --release --no-codesign

      - run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -q -r "$GITHUB_WORKSPACE/HMC-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HMC-ios-unsigned
          path: HMC-ios-unsigned.ipa
